<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Notes App</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gray-50 p-4 sm:p-8">

    <!-- Header and User ID Display -->
    <div class="max-w-4xl mx-auto mb-6 text-center">
        <h1 class="text-4xl font-extrabold text-indigo-600">Secure Notes Web App</h1>
        <p class="text-sm text-gray-500 mt-2">
            Notes are saved instantly to the cloud. Your unique session ID is: 
            <span id="user-id-display" class="font-mono text-xs bg-indigo-100 px-2 py-0.5 rounded-md text-indigo-800 break-all">Loading...</span>
        </p>
    </div>

    <!-- Main Content Grid -->
    <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Column 1: Add New Note Form (Sticky on Desktop) -->
        <div class="md:col-span-1">
            <div class="sticky top-8 bg-white p-6 rounded-xl shadow-lg border border-indigo-100">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">Create New Note</h2>
                <form id="add-note-form">
                    <div class="mb-4">
                        <label for="note-title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                        <input type="text" id="note-title" required 
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                               placeholder="e.g., Project Ideas">
                    </div>
                    <div class="mb-6">
                        <label for="note-content" class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                        <textarea id="note-content" rows="4" required 
                                  class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 resize-none transition duration-150"
                                  placeholder="What do you need to remember?"></textarea>
                    </div>
                    <button type="submit" id="add-button"
                            class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md shadow-indigo-300">
                        Add Note
                    </button>
                    <div id="status-message" class="mt-3 text-sm text-center text-red-500 hidden"></div>
                </form>
            </div>
        </div>

        <!-- Column 2: Notes List -->
        <div class="md:col-span-2">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b pb-2">My Notes</h2>
            <div id="notes-list" class="space-y-4">
                <!-- Notes will be injected here by JavaScript -->
                <div id="loading-notes" class="text-center p-6 bg-white rounded-xl shadow">
                    <div class="animate-spin inline-block w-6 h-6 border-[3px] border-current border-t-transparent text-indigo-500 rounded-full" role="status"></div>
                    <p class="mt-2 text-indigo-600">Connecting to database...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Set debug level for better logging
        setLogLevel('Debug');

        // Global environment variables (must be present for Canvas)
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // DOM elements
        const notesList = document.getElementById('notes-list');
        const form = document.getElementById('add-note-form');
        const titleInput = document.getElementById('note-title');
        const contentInput = document.getElementById('note-content');
        const statusMessage = document.getElementById('status-message');
        const userIdDisplay = document.getElementById('user-id-display');
        const loadingNotes = document.getElementById('loading-notes');

        let db, auth, userId = null;
        let notesCollectionRef = null;

        // 1. Initialize Firebase and Authenticate
        async function initializeAppAndAuth() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Sign in using custom token or anonymously
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }
                
                userId = auth.currentUser?.uid || crypto.randomUUID();
                userIdDisplay.textContent = userId;

                // Define the collection reference for private notes
                notesCollectionRef = collection(db, 'artifacts', appId, 'users', userId, 'notes');

                // Start listening to notes
                listenForNotes();

            } catch (error) {
                console.error("Firebase initialization or authentication failed:", error);
                statusMessage.textContent = "Initialization failed. Check console for details.";
                statusMessage.classList.remove('hidden');
                loadingNotes.innerHTML = '<p class="text-red-500">Failed to load notes: Initialization Error.</p>';
            }
        }

        // 2. Real-time Listener for Notes
        function listenForNotes() {
            if (!notesCollectionRef) return;

            onSnapshot(notesCollectionRef, (snapshot) => {
                notesList.innerHTML = ''; // Clear existing notes
                
                if (loadingNotes) loadingNotes.remove(); // Remove loading state once data starts flowing

                if (snapshot.empty) {
                    notesList.innerHTML = `
                        <div class="p-6 bg-white border border-dashed border-gray-300 rounded-xl text-center text-gray-500">
                            <p class="font-semibold">No notes yet!</p>
                            <p class="text-sm">Use the form to the left to add your first note.</p>
                        </div>
                    `;
                } else {
                    const fragment = document.createDocumentFragment();
                    snapshot.forEach(doc => {
                        const note = doc.data();
                        const noteElement = createNoteElement(doc.id, note.title, note.content, note.timestamp);
                        fragment.appendChild(noteElement);
                    });
                    notesList.appendChild(fragment);
                }
            }, (error) => {
                console.error("Error listening to notes:", error);
                notesList.innerHTML = `<p class="text-red-500 p-4">Error fetching notes: ${error.message}</p>`;
            });
        }

        // 3. Create Note HTML Element
        function createNoteElement(id, title, content, timestamp) {
            const date = timestamp ? new Date(timestamp.seconds * 1000).toLocaleString() : 'Just now';
            
            const div = document.createElement('div');
            div.className = 'bg-white p-5 rounded-xl shadow-md transition hover:shadow-lg flex flex-col justify-between border-l-4 border-indigo-400';
            div.innerHTML = `
                <div class="mb-4">
                    <h3 class="text-xl font-bold text-gray-900">${title}</h3>
                    <p class="text-gray-600 mt-2 whitespace-pre-wrap">${content}</p>
                </div>
                <div class="flex justify-between items-end border-t border-gray-100 pt-3">
                    <p class="text-xs text-gray-400">Saved: ${date}</p>
                    <button data-id="${id}" class="delete-btn text-red-500 hover:text-red-700 transition duration-150 text-sm font-medium">
                        Delete
                    </button>
                </div>
            `;
            
            // Attach event listener to the delete button
            div.querySelector('.delete-btn').addEventListener('click', handleDeleteNote);
            return div;
        }

        // 4. Add New Note Function
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            
            if (!title || !content || !notesCollectionRef) {
                statusMessage.textContent = "Title and content cannot be empty.";
                statusMessage.classList.remove('hidden');
                return;
            }

            try {
                // Add the document to Firestore
                await addDoc(notesCollectionRef, {
                    title: title,
                    content: content,
                    timestamp: new Date() // Store server time for sorting
                });

                // Clear form inputs and success message
                titleInput.value = '';
                contentInput.value = '';
                statusMessage.textContent = 'Note saved successfully!';
                statusMessage.className = 'mt-3 text-sm text-center text-green-600';
                statusMessage.classList.remove('hidden');
                
            } catch (error) {
                console.error("Error adding document:", error);
                statusMessage.textContent = `Error saving note: ${error.message}`;
                statusMessage.className = 'mt-3 text-sm text-center text-red-500';
                statusMessage.classList.remove('hidden');
            }
        });

        // 5. Delete Note Function
        async function handleDeleteNote(e) {
            const noteId = e.target.getAttribute('data-id');
            if (!noteId || !notesCollectionRef) return;

            // Simple confirmation (no window.confirm, just visual feedback)
            e.target.textContent = 'Deleting...';
            e.target.disabled = true;

            try {
                const noteRef = doc(db, 'artifacts', appId, 'users', userId, 'notes', noteId);
                await deleteDoc(noteRef);
                // Success is handled by the onSnapshot listener automatically refreshing the list
                console.log("Document successfully deleted:", noteId);
            } catch (error) {
                console.error("Error removing document: ", error);
                // Re-enable button and show error if deletion failed
                e.target.textContent = 'Delete';
                e.target.disabled = false;
            }
        }

        // Start the application
        initializeAppAndAuth();
    </script>
</body>
</html>
